[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoahIsCool/auto-camera"

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-framing = { path = "crates/ac-framing" }
ac-switcher = { path = "crates/ac-switcher" }
ac-eval = { path = "crates/ac-eval" }
ac-media = { path = "crates/ac-media" }
ac-vision = { path = "crates/ac-vision" }
ac-subjects = { path = "crates/ac-subjects" }
ac-director = { path = "crates/ac-director" }
ac-compositor = { path = "crates/ac-compositor" }
ac-output = { path = "crates/ac-output" }
ac-engine = { path = "crates/ac-engine" }
ac-sources = { path = "crates/ac-sources" }
ac-sidecar = { path = "crates/ac-sidecar" }
ac-audio = { path = "crates/ac-audio" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# CLAUDE.md: private items are documented too (`missing_docs` covers only
# public ones); `-D warnings` makes this fatal in CI.
missing_docs_in_private_items = "warn"

# The tracker and compositor do per-pixel work; optimize them in dev and test
# builds so debug runs of the engine and its tests stay real-time.
[profile.dev.package.ac-vision]
opt-level = 3

[profile.dev.package.ac-compositor]
opt-level = 3

# The sidecar host downscales every frame it sends with a box filter.
[profile.dev.package.ac-sidecar]
opt-level = 3

# The program loudness meter filters every sample of program audio (two
# biquads and a 48-tap interpolator per channel).
[profile.dev.package.ac-audio]
opt-level = 3
