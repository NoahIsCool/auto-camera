[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NoahIsCool/auto-camera"

[workspace.dependencies]
ac-core = { path = "crates/ac-core" }
ac-framing = { path = "crates/ac-framing" }
ac-switcher = { path = "crates/ac-switcher" }
ac-eval = { path = "crates/ac-eval" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
