[package]
name = "ac-eval"
description = "Evaluation-set labels (schema, validator, MOT import), the per-tick trace schema, and the framing, tracking and switching scorers with their thresholds and report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ac-core.workspace = true
serde.workspace = true
# Exact float parsing: a canonical label file or a trace line read and
# written again must give back the same bytes, and pixel boxes divided by
# picture sizes use all 17 significant digits, which default parsing can get
# wrong by one ULP.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
thiserror.workspace = true
# The scorers' thresholds file is TOML, so each limit can carry its spec
# source in a comment; the engine already reads its config with this crate.
toml = "1.1"

[lints]
workspace = true
