[package]
name = "ac-sidecar"
description = "Host for an out-of-process detector (SAM 3.1 on MLX first): a length-prefixed JSON protocol over a child's stdin and stdout, behind ac_vision::Detector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ac-core.workspace = true
ac-media.workspace = true
ac-vision.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json = "1.0"

[lints]
workspace = true

# A stand-in sidecar for the integration tests; see its module docs.
[[bin]]
name = "ac-fake-sidecar"
path = "src/bin/ac-fake-sidecar.rs"
test = false
doc = false
