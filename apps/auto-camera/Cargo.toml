[package]
name = "auto-camera"
description = "Operator app: multiview, preview/program switching, director and output in a native window, or headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Enables the OWLv2 ONNX detector (see crates/ac-vision/README.md).
onnx = ["ac-engine/onnx"]

[dependencies]
ac-core.workspace = true
ac-director.workspace = true
ac-engine.workspace = true
ac-media.workspace = true
ac-output.workspace = true
ac-sidecar.workspace = true
ac-switcher.workspace = true
serde.workspace = true
tracing.workspace = true
clap = { version = "4.6", features = ["derive"] }
# Ctrl-C, SIGTERM and SIGHUP ("termination") run the normal shutdown, so the
# detector sidecar (in its own process group) never outlives the app.
ctrlc = { version = "3.5", features = ["termination"] }
# OpenGL (glow) renderer and X11 windowing: both load their system libraries
# at run time, so the app builds on Linux CI without GUI development
# packages. eframe 0.35 is the newest release supporting Rust 1.92.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde_json = "1.0"
# SHA-256 of the config and the model files in the log's header: pure Rust,
# no dependencies, ISC, and already in the tree (ort's downloader uses it).
hmac-sha256 = "1.1"

[dev-dependencies]
ac-eval.workspace = true
ac-sources.workspace = true
# Window tests drive the real UI through its AccessKit tree with egui's plain
# test harness: no renderer (its wgpu feature stays off), so they need no GPU
# or display. 0.35 matches eframe and supports Rust 1.92.
egui_kittest = "0.35"

[lints]
workspace = true
