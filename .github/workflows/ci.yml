name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ffmpeg is installed below, so tests that need it must run, not skip.
  AC_REQUIRE_FFMPEG: "1"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Includes ac-sidecar's tests against sidecars/sam3-mlx/server.py on
      # its fake backend, which need the runner's python3.
      - run: cargo test --locked
      # The SAM sidecar's own tests: standard library only; the MLX tests
      # skip themselves without MLX.
      - run: python3 -B -m unittest
        working-directory: sidecars/sam3-mlx

  # CLAUDE.md: a module over ~600 lines is a smell. Fail any non-test Rust
  # module over 600 lines; the script's docs say what counts as a test
  # module. Standard library only, so no toolchain is needed.
  module-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/module_size.py
      - run: python3 -B -m unittest discover -s scripts

  # The workspace promises rust-version 1.92; build everything with it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --workspace --all-targets

  # The ONNX Runtime backend is behind a feature; lint the whole workspace
  # with it and run the vision tests (model tests skip without artifacts).
  onnx:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --features auto-camera/onnx --all-targets -- -D warnings
      - run: cargo test --locked -p ac-vision --features onnx
