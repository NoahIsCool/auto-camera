# A studio fed by a local video file, with the OWLv2 detector.
#
# Requires ffmpeg on PATH, and a build with the `onnx` feature:
#
#   cargo run -p auto-camera --features onnx -- --config config/file-source.example.toml
#
# `--check` in place of a run lists every missing file or tool without
# starting the studio (see the README's "Readiness check").
#
# Copy this file, then point `path`, `model` and `tokenizer` at real files
# (see crates/ac-vision/README.md for exporting OWLv2 to ONNX). Relative paths
# are resolved against this file's directory.

# The layout this file is written in (README, "Studio configuration").
schema = 1

[[sources]]
id = "cam-1"
name = "Rehearsal"
kind = "file"
path = "../media/rehearsal.mp4"
loop_playback = true
# Decode at most 1280 pixels wide; the tracker and compositor work on this.
max_width = 1280
audio = true
# Play only part of the file, as a clip of its own (PTS from 0):
# start_s = 120.0
# duration_s = 180.0

# A prompt names who or what to frame, and may name shots too (ADR 0003):
#
# * Shot words at either end, or right after a possessive, pick framings:
#   close, close-up, cu, head and shoulders, headshot, tight, face (Close);
#   medium close, mcu, chest up, bust (Medium close); medium, mid shot, ms,
#   waist up (Medium); upper body, half body (Medium and Medium close, until
#   Noah picks one); full, full body, full length, head to toe, long shot, fs
#   (Full); and "wide" after a subject ("drummer wide", Full for now; the
#   subject with its kit is later work). "speaker's upper body" and plurals
#   ("close-ups") work too.
# * Role words are rewritten for the detector when they are the whole
#   subject: speaker, pastor and preacher ask for "a person speaking",
#   guitarist for "a person playing guitar", drummer for "a person playing
#   drums", singer for "a person singing". Each is a hypothesis until
#   benchmarked on footage; the window shows what the detector sees. Guitar
#   and drums are objects OWLv2 finds ("a person playing drums": the drummer
#   in 20 of 20 test frames, no false boxes). Speaking and singing are
#   actions, which it cannot see: "a person speaking" gave every person the
#   speaker's shots (the speaker in 20 of 20 frames, 300 false boxes on 40),
#   photos on the screen included, so the window notes it on such a prompt;
#   take the speaker's shot by hand.
# * A person subject (a person or role word) on a whole-person box is cut at
#   body lines measured from the head; anything else ("guitar close-up")
#   scales its box.
# * Explicit `presets` always win over shot words; with neither, a query
#   gets medium and close. `literal = true` sends the prompt as typed; use it
#   for a prompt that is only shot words ("face"), which is refused otherwise.
# * Queries whose prompts ask the detector for the same thing ("speaker
#   close-up" and "speaker wide") share one subject, which gets the shots of
#   both.
#
# Prompts without shot or role words, like the first two, keep their
# detector phrase and presets. Their framing changes when they name a person
# and the detector returns whole people (OWLv2 people-first): shots are cut
# at body lines instead of scaling the box, and those the zoom ceiling cannot
# reach are drawn at the ceiling and marked limited. On a guitarist half the
# frame high, the second query's Full is now a 1.8x crop instead of the wide,
# and its Tight needs about 9x, so it is drawn at its 6x ceiling and marked.
#
# A query's `priority` (1 to 5, higher first) ranks its subjects for the
# director: at equal quality it suggests the higher one's shot. Without any
# `priority` the list order ranks them (5, 4, 3, ...); here the Speaker has 4
# and the two queries without one have 3. Only differences count, so queries
# that all share one priority change nothing.
[[queries]]
name = "Speaker"
prompt = "a person speaking at a lectern"
presets = ["medium", "close"]
priority = 4

[[queries]]
name = "Guitarist"
prompt = "a person playing guitar"
presets = ["full", { id = "tight", name = "Tight", size = "close", headroom = 0.03, max_zoom = 6.0 }]

[[queries]]
name = "Drummer"
# No `presets`: "wide" picks a Full shot, and the detector is asked for
# "a person playing drums".
prompt = "drummer wide"

# The parser's words are data. Entries here are added to the built-in ones,
# and replace a built-in entry with the same words. A role's `needs`
# ("action" or "object") says what its phrase asks the detector to see; an
# action draws the window's notice, and an entry without it draws none:
#
# [lexicon]
# roles = [{ word = "worship leader", phrase = "a person singing", needs = "action" }]
# shots = [{ phrase = "cowboy", sizes = ["medium"] },
#          { phrase = "upper body", sizes = ["medium"] }]
# person_words = ["organist"]

[detector]
kind = "owl"
# The split export (crates/ac-vision/README.md) caches prompt embeddings; for
# the combined one, set model = ".../model.onnx" and drop text_encoder.
model = "../models/owlv2-split-onnx/detector.onnx"
text_encoder = "../models/owlv2-split-onnx/text_encoder.onnx"
tokenizer = "../models/owlv2-split-onnx/tokenizer.json"
# Detections are whole people: each pass also looks for "a person" and for
# the object each prompt names ("a guitar", "a lectern"), and a prompt picks
# the people holding its object (crates/ac-vision/README.md, "Prompts").
# Objects need this score. Prompts that only describe people ("a person",
# "a woman", "a person speaking") use person_threshold (0.15) instead, and
# the subject store's floor follows it unless [subjects] min_score is set.
score_threshold = 0.3
# CoreML on Apple Silicon (the default): about 0.2 s per pass after a
# compile of a few minutes on first use, cached next to the model.
use_coreml = true

[discovery]
# OWLv2 base takes about 0.2 s per frame on CoreML and 2 s on an Apple CPU;
# the tracker fills the gaps.
rate_hz = 1.0
max_result_age_s = 3.0

[director]
mode = "suggest"
profile = "music"

[output]
width = 1280
height = 720
fps = 30
# Program audio comes from this source's embedded audio track.
audio_source = "cam-1"
# rtmp_url = "rtmp://live.example.com/app/STREAM-KEY"
# Unlike the paths above, a relative recording path is taken from the
# working folder (the repository root, run as above), as one typed at Start
# Output is; so is a relative `ffmpeg` path. `--check` says where.
record_path = "recordings/show.mp4"
