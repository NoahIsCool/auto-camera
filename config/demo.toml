# Demo studio: one synthetic camera with three moving subjects and the
# ground-truth "synthetic" detector, so it runs anywhere without a camera,
# a model or a video file.
#
#   cargo run -p auto-camera                         # operator window
#   cargo run -p auto-camera -- --headless --seconds 5 --record /tmp/demo.mp4
#   cargo run -p auto-camera -- --check                # is it ready? (no start)
#
# Relative paths in this file are resolved against this file's directory.

# The layout this file is written in (README, "Studio configuration").
schema = 1

[[sources]]
id = "stage"
name = "Stage"
kind = "synthetic"
width = 1280
height = 720
fps = 30
subjects = 3

# A prompt says who or what to frame, and may also say what shots to make:
# "person close-up" would make Close shots without a `presets` line. Explicit
# `presets` always win over such shot words; with neither, a query gets
# medium and close. The window's query form shows how a prompt reads before
# it is added ("Detector sees: person · Framing: ...").
[[queries]]
name = "Person"
prompt = "person"
presets = ["medium", "close"]

[detector]
# Answers every query with the pattern's true subject boxes.
kind = "synthetic"

[discovery]
# The template tracker cannot tell the identical synthetic subjects apart
# when they cross; frequent discovery re-anchors them.
rate_hz = 10.0

[director]
# Suggest: the director stages its pick on preview and the operator takes
# it. Auto-take is opt-in; choose "auto" in the window (or here) to let it
# cut by itself. A headless run cuts the first wide to program either way.
# In Auto mode your own switching drops it back to Suggest (takeover =
# "suggest"); "pause" holds its takes for pause_s seconds instead, and
# "director" lets it carry on. Skip leaves a suggestion out for skip_s.
mode = "suggest"
profile = "talk"
takeover = "suggest"
pause_s = 10
skip_s = 30

[switcher]
transition = "mix"
duration = 0.8

# Settle-before-take, off by default: an operator Cut, Auto or Accept waits
# up to max_wait_s for the preview crop to settle; a second press takes at
# once.
# [switcher.settle]
# enabled = true
# threshold = 0.6
# max_wait_s = 0.5

[output]
width = 1280
height = 720
fps = 30
video_bitrate_kbps = 4000
# rtmp_url = "rtmp://live.example.com/app/STREAM-KEY"
# record_path = "recordings/demo.mp4"
